<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Weather Station 17 — DOS-style automated weather terminal.">
  <title>Weather Station 17</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="terminal" class="terminal" aria-label="Weather Station 17 terminal">
    <div id="screen" class="screen" aria-live="polite"></div>

    <form id="command-form" class="command-line" autocomplete="off">
      <label for="command-input" id="prompt-label">C:\WS17&gt;</label>
      <input
        id="command-input"
        name="command"
        type="text"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        aria-label="Command"
      >
      <span class="cursor" aria-hidden="true">█</span>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
